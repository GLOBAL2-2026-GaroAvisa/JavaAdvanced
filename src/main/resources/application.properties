spring.application.name=GaroAvisa
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.table=FLYWAY_HISTORY_GAROAVISA
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

garoavisa.jwt.segredo=${JWT_SECRET}
garoavisa.jwt.expiracao=7d