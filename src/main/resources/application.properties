spring.application.name=GaroAvisa
server.port=${PORT:8080}
garoavisa.clima.url=${CLIMA_URL:http://localhost:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.table=FLYWAY_HISTORY_GAROAVISA
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

garoavisa.jwt.segredo=${JWT_SECRET}
garoavisa.jwt.expiracao=7d

# RabbitMQ (CloudAMQP): a AMQP URL vem de uma variavel de ambiente
spring.rabbitmq.addresses=${RABBITMQ_URL}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=never	

# So usamos chat. O starter da OpenAI configura seis modelos e cada um tenta
# construir um cliente no boot - sem chave, o de audio derruba a aplicacao.
# Desligar os cinco que nao usamos tambem deixa o boot mais leve.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# IA: Explicacao do Dia (feature 23).
# Sem a OPENAI_API_KEY a aplicacao sobe assim mesmo e usa o texto padrao
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=300