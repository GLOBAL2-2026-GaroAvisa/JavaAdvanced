spring.application.name=GaroAvisa
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.table=FLYWAY_HISTORY_GAROAVISA
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

garoavisa.jwt.segredo=${JWT_SECRET}
garoavisa.jwt.expiracao=7d

# RabbitMQ (CloudAMQP): a AMQP URL vem de uma variavel de ambiente
spring.rabbitmq.addresses=${RABBITMQ_URL}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=never	